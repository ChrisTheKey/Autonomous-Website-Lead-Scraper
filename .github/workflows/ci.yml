name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  lint-backend:
    name: Backend – Lint & Type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff mypy
      - run: ruff check .
      - run: ruff format --check .

  lint-frontend:
    name: Frontend – Type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run lint

  zero-agent:
    name: ZERO child agent – tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Deliberately not requirements.txt. The child-agent surface must run
      # without the database layer, and installing it here would stop this job
      # from proving that.
      - run: pip install pytest pyyaml pydantic pydantic-settings ruff
      - run: ruff check zero_agent --line-length 100
      - run: python -m pytest -q zero_agent/tests
