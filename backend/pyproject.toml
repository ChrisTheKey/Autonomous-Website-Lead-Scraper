[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonomous-lead-scraper"
version = "0.1.0"
description = "Autonomous Website Lead Scraper with AI-powered extraction and CRM sync"
requires-python = ">=3.11"

dependencies = [
    # ── Web Framework ──────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # ── Data Validation ────────────────────────────────────
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",

    # ── HTTP Client ────────────────────────────────────────
    "httpx>=0.27.0",

    # ── Web Scraping ───────────────────────────────────────
    "scrapy>=2.11.0",

    # ── Browser Automation ─────────────────────────────────
    "playwright>=1.45.0",

    # ── Database ───────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # ── Cache / Message Broker ─────────────────────────────
    "redis[hiredis]>=5.0.0",

    # ── Task Queue ─────────────────────────────────────────
    "celery[redis]>=5.4.0",

    # ── Workflow Orchestration (Temporal) ──────────────────
    "temporalio>=1.7.0",

    # ── AI / LLM ───────────────────────────────────────────
    "openai>=1.40.0",
    "openai-agents>=0.0.9",
    "pydantic-ai>=0.0.13",
    "instructor>=1.4.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "llama-index>=0.11.0",
    "llama-index-llms-openai>=0.2.0",
    "langextract>=0.1.0",

    # ── Google Maps ────────────────────────────────────────
    "googlemaps>=4.10.0",

    # ── CRM Integrations ───────────────────────────────────
    "hubspot-api-client>=9.0.0",
    "simple-salesforce>=1.12.0",

    # ── Dashboards ─────────────────────────────────────────
    "streamlit>=1.38.0",

    # ── Utilities ──────────────────────────────────────────
    "python-dotenv>=1.0.0",
    "tenacity>=8.5.0",
    "structlog>=24.4.0",
    "rich>=13.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "httpx",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
