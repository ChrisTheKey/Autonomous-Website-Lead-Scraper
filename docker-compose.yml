version: "3.9"

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/lead_discovery
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
  APP_ENV: production
  MAX_RESULTS_PER_SEARCH: "100"
  MAX_PAGES_PER_DOMAIN: "10"
  GOOGLE_DATA_TTL_DAYS: "30"
  EXPORT_REQUIRES_VERIFICATION: "true"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lead_discovery
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      <<: *app-env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker-search:
    build: .
    command: celery -A app.workers.tasks.celery_app worker -Q search -c 2 -l info
    environment:
      <<: *app-env
    volumes:
      - .:/app
    depends_on:
      - redis
      - postgres

  worker-crawl:
    build: .
    command: celery -A app.workers.tasks.celery_app worker -Q crawl -c 4 -l info
    environment:
      <<: *app-env
    volumes:
      - .:/app
    depends_on:
      - redis
      - postgres

  worker-analyse:
    build: .
    command: celery -A app.workers.tasks.celery_app worker -Q analyse -c 4 -l info
    environment:
      <<: *app-env
    volumes:
      - .:/app
    depends_on:
      - redis
      - postgres

  flower:
    build: .
    command: celery -A app.workers.tasks.celery_app flower --port=5555
    environment:
      <<: *app-env
    ports:
      - "5555:5555"
    depends_on:
      - redis

volumes:
  pgdata:
  redisdata:
