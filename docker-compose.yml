version: "3.9"

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/lead_scraper
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  TEMPORAL_HOST: temporal:7233
  SECRET_KEY: changeme-in-production

services:
  # ── Infrastructure ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lead_scraper
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Temporal ───────────────────────────────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.24
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: password
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.28
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8080:8080"
    depends_on:
      - temporal

  # ── Backend ────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-scrape:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker -Q scrape -c 4 -l info
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - postgres

  worker-enrich:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker -Q enrich -c 2 -l info
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - postgres

  worker-crm:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker -Q crm -c 2 -l info
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - postgres

  temporal-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.workflows.worker
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      - temporal
      - postgres

  dashboard:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
    ports:
      - "8501:8501"
    depends_on:
      - api

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
